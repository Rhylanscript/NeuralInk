services:
  web-app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # syncs frontend & backend changes for live dev without rebuilding
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./model:/app/model
      - ./weights:/app/weights
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=true
  